<div class="page">
  <div class="page-header">
    <h1>Puestos</h1>
    <div style="display:flex; gap:10px; align-items:center">
      <input type="text" placeholder="Buscar puesto..."
             (input)="onBusqueda($any($event.target).value)"
             class="buscador">
      <a routerLink="/configuracion/puestos/nuevo" class="btn-nuevo">+ Nuevo puesto</a>
    </div>
  </div>

  <div *ngIf="cargando" class="skeleton-tabla">
    <div *ngFor="let i of [1,2,3,4,5]" class="skeleton-fila">
      <div class="skeleton skeleton-text" style="width:200px"></div>
      <div class="skeleton skeleton-text" style="width:60px"></div>
    </div>
  </div>

  <div class="tabla-container" *ngIf="!cargando">
    <table>
      <thead>
        <tr>
          <th>DESCRIPCIÓN</th>
          <th>ACCIONES</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let puesto of puestosFiltrados">
          <td>{{ puesto.descripcion }}</td>
          <td>
            <a [routerLink]="['/configuracion/puestos/editar', puesto.id]" class="btn-editar-sm">
              <span class="material-icons" style="font-size:16px">edit</span>
            </a>
            <button class="btn-icono" (click)="confirmarEliminar(puesto.id, $event)">
              <span class="material-icons" style="font-size:14px">close</span>
            </button>
          </td>
        </tr>
        <tr *ngIf="puestosFiltrados.length === 0">
          <td colspan="2" class="sin-resultados">No hay puestos</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" *ngIf="mostrarModal" (click)="cancelarEliminar()">
  <div class="modal" (click)="$event.stopPropagation()">
    <h3>¿Eliminar puesto?</h3>
    <p>Esta acción no se puede deshacer. Si hay candidatos asignados a este puesto no se podrá eliminar.</p>
    <div class="modal-botones">
      <button class="btn-cancelar" (click)="cancelarEliminar()">Cancelar</button>
      <button class="btn-eliminar" (click)="ejecutarEliminar()">Eliminar</button>
    </div>
  </div>
</div>
